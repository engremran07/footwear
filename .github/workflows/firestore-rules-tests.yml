name: Firestore Rules Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Firestore Security Rules Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/firestore-rules/package-lock.json

      - name: Install test dependencies
        run: npm ci --prefix tests/firestore-rules

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.31.0

      - name: Run Firestore rules emulator tests
        run: firebase emulators:exec --project shoeserp-clean-20260327 --only firestore "npm --prefix tests/firestore-rules test"