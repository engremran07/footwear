name: footwear_erp
description: Footwear business ERP — production, inventory, orders, payroll, P&L.
publish_to: 'none'
version: 3.10.17+1128

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_crashlytics: ^6.0.1
  firebase_app_check: ^0.5.1
  flutter_riverpod: ^3.3.2
  flutter_local_notifications: ^22.3.3
  riverpod_annotation: ^4.0.3
  go_router: ^18.1.1
  intl: ^0.20.0
  cached_network_image: ^4.0.5
  image_picker: ^1.1.2
  uuid: ^4.5.1
  logger: ^2.4.0
  bidi: ^2.0.13
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  font_awesome_flutter: ^11.0.0
  web: ^1.1.0
  cupertino_icons: ^2.0.0
  flutter_animate: ^4.5.0
  shimmer: ^4.0.0
  fl_chart: ^1.2.0
  http: ^1.2.2
  archive: ^4.5.2
  crypto: ^3.0.3
  google_sign_in: ^7.2.0
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.2.0
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Variable.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
