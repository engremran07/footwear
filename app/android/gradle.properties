org.gradle.jvmargs=-Xmx2G -Xms1G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Xss512k -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
# Reduce concurrent Gradle workers to lower peak memory usage on Windows
org.gradle.workers.max=1
